spring:
  application:
    name: kplpay

server:
  port: 8080

insee:
  base-url: https://api.insee.fr/api-sirene/3.11
  api-key: ${INSEE_API_KEY}

kplpay:
  billing:
    vat-rate: 0.20
    payment-terms-days: 30

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5432/kplpay
    username: kplpay
    password: ${POSTGRES_PASSWORD:kplpay}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    com.ankhsquirrel.kplpay: DEBUG

---
spring:
  config:
    activate:
      on-profile: test
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

# Test-only stand-ins. Integration tests that exercise the INSEE client override
# insee.base-url via @DynamicPropertySource to point at WireMock.
insee:
  base-url: http://localhost:0
  api-key: test

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://postgres:5432/kplpay
    username: kplpay
    password: ${POSTGRES_PASSWORD:kplpay}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration